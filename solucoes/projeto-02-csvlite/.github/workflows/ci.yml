# Modelo de CI para o workspace do csvlite (o mesmo da lição 07 do Módulo 09,
# com `--workspace`).
#
# O GitHub só lê workflows em `.github/workflows/` na RAIZ do repositório.
# Este arquivo, aqui dentro do curso, não roda: copie a pasta `.github/`
# para a raiz do SEU repositório (onde está o Cargo.toml do workspace).
#
# Versões das actions conferidas em 2026-10-15.

name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Qualquer aviso do rustc, do clippy ou do rustdoc vira erro (Cargo 1.97+).
  CARGO_BUILD_WARNINGS: deny

jobs:
  check:
    name: fmt, clippy, test, doc, bench
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo test --workspace --locked
      - run: cargo doc --workspace --no-deps --locked
      - run: cargo bench --workspace --no-run --locked

  msrv:
    name: MSRV (1.96)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.96
      - uses: Swatinem/rust-cache@v2
      # No Cargo 1.96, CARGO_BUILD_WARNINGS é ignorada: este job só confere
      # se o workspace compila na versão mínima declarada em rust-version.
      - run: cargo check --workspace --all-targets --locked
