# Solução do exercício 4 do Módulo 09: CI do minigrep (Projeto 1).
#
# No SEU repositório do minigrep, salve este arquivo como
# .github/workflows/ci.yml (na raiz, ao lado do Cargo.toml).
# Versões das actions conferidas em 2026-10-15.

name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_WARNINGS: deny

jobs:
  check:
    name: fmt, clippy, test, doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked
      - run: cargo test --locked
      - run: cargo doc --no-deps --locked

  msrv:
    name: MSRV (1.96)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.96
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets --locked
