<svg xmlns="http://www.w3.org/2000/svg" width="780" height="430" viewBox="0 0 780 430" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="780" height="430" rx="14" fill="#ffffff"/>
  <text x="30" y="40" font-size="20" font-weight="bold" fill="#111827">Option&lt;T&gt;: quando o None sai de graça</text>
  <text x="30" y="64" font-size="15" fill="#4b5563">largura proporcional ao tamanho (64 bits); números medidos com size_of</text>

  <!-- u32 -->
  <text x="30" y="113" font-size="16" fill="#111827" font-family="Menlo, Consolas, monospace">u32</text>
  <rect x="250" y="88" width="160" height="40" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="330" y="113" font-size="15" text-anchor="middle" fill="#1e3a8a">valor</text>
  <text x="760" y="113" font-size="15" text-anchor="end" fill="#374151">4 bytes</text>

  <!-- Option<u32> -->
  <text x="30" y="163" font-size="16" fill="#111827" font-family="Menlo, Consolas, monospace">Option&lt;u32&gt;</text>
  <rect x="250" y="138" width="160" height="40" fill="#bfdbfe" stroke="#3b82f6" stroke-width="2"/>
  <text x="330" y="163" font-size="15" text-anchor="middle" fill="#1e3a8a">tag (+ preench.)</text>
  <rect x="410" y="138" width="160" height="40" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="490" y="163" font-size="15" text-anchor="middle" fill="#1e3a8a">valor</text>
  <text x="760" y="163" font-size="15" text-anchor="end" fill="#374151">8 bytes</text>
  <text x="250" y="200" font-size="14" fill="#6b7280">todo padrão de bits é um u32 válido: o tag precisa de espaço próprio</text>

  <line x1="30" y1="222" x2="750" y2="222" stroke="#e5e7eb" stroke-width="2"/>

  <!-- &i32 -->
  <text x="30" y="263" font-size="16" fill="#111827" font-family="Menlo, Consolas, monospace">&amp;i32</text>
  <rect x="250" y="238" width="320" height="40" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
  <text x="410" y="263" font-size="15" text-anchor="middle" fill="#4c1d95">endereço (nunca 0)</text>
  <text x="760" y="263" font-size="15" text-anchor="end" fill="#374151">8 bytes</text>

  <!-- Option<&i32> -->
  <text x="30" y="313" font-size="16" fill="#111827" font-family="Menlo, Consolas, monospace">Option&lt;&amp;i32&gt;</text>
  <rect x="250" y="288" width="320" height="40" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
  <text x="410" y="313" font-size="15" text-anchor="middle" fill="#4c1d95">Some: endereço · None: 0</text>
  <text x="760" y="313" font-size="15" text-anchor="end" fill="#374151">8 bytes</text>

  <!-- Option<Box<i32>> -->
  <text x="30" y="363" font-size="16" fill="#111827" font-family="Menlo, Consolas, monospace">Option&lt;Box&lt;i32&gt;&gt;</text>
  <rect x="250" y="338" width="320" height="40" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="410" y="363" font-size="15" text-anchor="middle" fill="#14532d">Some: ponteiro p/ heap · None: 0</text>
  <text x="760" y="363" font-size="15" text-anchor="end" fill="#374151">8 bytes</text>

  <text x="30" y="405" font-size="14" fill="#374151">O endereço 0 nunca é válido para &amp;T ou Box&lt;T&gt;. Esse "nicho" vira o None, sem byte extra.</text>
</svg>
