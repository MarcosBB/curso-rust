<svg xmlns="http://www.w3.org/2000/svg" width="860" height="360" viewBox="0 0 860 360" font-family="Helvetica, Arial, sans-serif" font-size="15">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="seta-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="860" height="360" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="24" y="34" font-size="17" font-weight="bold" fill="#0f172a">Rc&lt;Config&gt;: três donos, uma alocação com dois contadores</text>

  <text x="24" y="72" font-weight="bold" fill="#3b82f6">Stack</text>
  <text x="430" y="72" font-weight="bold" fill="#f97316">Heap</text>
  <line x1="400" y1="56" x2="400" y2="340" stroke="#cbd5e1" stroke-dasharray="6 5"/>

  <rect x="24" y="86" width="240" height="46" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
  <text x="36" y="114" fill="#0f172a"><tspan font-weight="bold">config</tspan>: Rc&lt;Config&gt; (8 bytes)</text>
  <rect x="24" y="150" width="240" height="46" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
  <text x="36" y="178" fill="#0f172a"><tspan font-weight="bold">servidor.config</tspan>: Rc</text>
  <rect x="24" y="214" width="240" height="46" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
  <text x="36" y="242" fill="#0f172a"><tspan font-weight="bold">monitor.config</tspan>: Rc</text>
  <rect x="24" y="278" width="240" height="46" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="36" y="306" fill="#0f172a"><tspan font-weight="bold">w</tspan>: Weak&lt;Config&gt;</text>

  <path d="M264,109 C340,109 360,130 448,140" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#seta)"/>
  <path d="M264,173 C340,173 380,160 448,160" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#seta)"/>
  <path d="M264,237 C340,237 380,190 448,180" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#seta)"/>
  <path d="M264,301 C350,301 390,220 448,200" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#seta-c)"/>

  <rect x="450" y="100" width="380" height="170" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="2.5"/>
  <text x="466" y="126" font-weight="bold" fill="#0f172a">RcInner (uma alocação só)</text>
  <rect x="466" y="140" width="170" height="36" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="478" y="164" fill="#0f172a">strong = 3</text>
  <rect x="646" y="140" width="170" height="36" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="658" y="164" fill="#0f172a">weak = 1</text>
  <rect x="466" y="188" width="350" height="64" rx="6" fill="#ffffff" stroke="#f97316" stroke-width="2"/>
  <text x="478" y="212" fill="#0f172a">Config { nome: "prod", nivel: 2 }</text>
  <text x="478" y="236" font-size="14" fill="#475569">só leitura: Rc dá &amp;Config, nunca &amp;mut</text>

  <text x="450" y="300" font-size="14" fill="#334155">Rc::clone soma 1 em strong; cada drop subtrai 1.</text>
  <text x="450" y="320" font-size="14" fill="#334155">strong = 0: o Config é descartado.</text>
  <text x="450" y="340" font-size="14" fill="#334155">strong = 0 e weak = 0: a alocação é liberada.</text>
</svg>
