<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" viewBox="0 0 860 400" font-family="Helvetica, Arial, sans-serif" font-size="15">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="seta-v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="seta-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="860" height="400" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="24" y="34" font-size="17" font-weight="bold" fill="#0f172a">Arc&lt;Mutex&lt;Vec&lt;i32&gt;&gt;&gt; entre duas threads</text>

  <!-- Coluna das stacks -->
  <text x="24" y="72" font-weight="bold" fill="#3b82f6">Stack da thread main</text>
  <rect x="24" y="86" width="270" height="46" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
  <text x="36" y="114" fill="#0f172a"><tspan font-weight="bold">dados</tspan>: Arc (8 bytes)</text>
  <rect x="24" y="146" width="270" height="46" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="36" y="174" fill="#475569">dados.lock()  (esperando)</text>

  <text x="24" y="232" font-weight="bold" fill="#3b82f6">Stack da thread worker</text>
  <rect x="24" y="246" width="270" height="46" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
  <text x="36" y="274" fill="#0f172a"><tspan font-weight="bold">copia</tspan>: Arc (8 bytes)</text>
  <rect x="24" y="306" width="270" height="46" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2.5"/>
  <text x="36" y="334" fill="#0f172a"><tspan font-weight="bold">guarda</tspan>: MutexGuard</text>

  <line x1="330" y1="56" x2="330" y2="380" stroke="#cbd5e1" stroke-dasharray="6 5"/>
  <text x="370" y="72" font-weight="bold" fill="#f97316">Heap (uma alocação)</text>

  <!-- Caixa do heap -->
  <rect x="400" y="96" width="430" height="260" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="2.5"/>
  <text x="416" y="124" fill="#0f172a"><tspan font-weight="bold">strong = 2</tspan>  (contador atômico do Arc)</text>
  <rect x="440" y="150" width="370" height="190" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="456" y="176" font-weight="bold" fill="#0f172a">Mutex</text>
  <rect x="456" y="190" width="338" height="40" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="470" y="216" fill="#0f172a">estado: travado (worker)  · envenenado: não</text>
  <rect x="456" y="246" width="338" height="78" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="470" y="272" fill="#0f172a"><tspan font-weight="bold">dado</tspan>: Vec&lt;i32&gt; = [1, 2, 3]</text>
  <text x="470" y="300" fill="#475569">só acessível através do guarda</text>
  <!-- Setas -->
  <path d="M294,109 C340,109 350,120 398,126" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#seta)"/>
  <path d="M294,269 C350,269 350,150 398,140" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#seta)"/>
  <path d="M294,329 C370,329 400,290 454,286" fill="none" stroke="#dc2626" stroke-width="2.5" marker-end="url(#seta-v)"/>
  <path d="M294,169 C350,169 390,210 454,210" fill="none" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#seta-c)"/>

</svg>
