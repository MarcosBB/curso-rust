<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" font-family="Helvetica, Arial, sans-serif" font-size="15">
  <defs>
    <marker id="seta-verde" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="300" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="24" y="34" font-size="17" font-weight="bold" fill="#0f172a">String::with_capacity(5) e depois push_str("olá")</text>

  <!-- Stack -->
  <text x="24" y="74" font-weight="bold" fill="#3b82f6">Stack</text>
  <rect x="24" y="86" width="210" height="128" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
  <text x="38" y="110" font-weight="bold" fill="#16a34a">s: String (dono)</text>
  <line x1="24" y1="122" x2="234" y2="122" stroke="#e2e8f0"/>
  <text x="38" y="145" fill="#0f172a">ptr</text>
  <circle cx="206" cy="140" r="5" fill="#16a34a"/>
  <line x1="24" y1="156" x2="234" y2="156" stroke="#e2e8f0"/>
  <text x="38" y="177" fill="#0f172a">len = 4</text>
  <line x1="24" y1="186" x2="234" y2="186" stroke="#e2e8f0"/>
  <text x="38" y="206" fill="#0f172a">cap = 5</text>

  <!-- Heap -->
  <text x="330" y="74" font-weight="bold" fill="#f97316">Heap</text>
  <path d="M332,104 v-8 h296 v8" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="480" y="90" font-size="14" fill="#475569" text-anchor="middle">cap = 5 bytes reservados</text>

  <rect x="330" y="110" width="60" height="64" rx="6" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <rect x="390" y="110" width="60" height="64" rx="6" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <rect x="450" y="110" width="60" height="64" rx="6" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <rect x="510" y="110" width="60" height="64" rx="6" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <rect x="570" y="110" width="60" height="64" rx="6" fill="#ffffff" stroke="#f97316" stroke-width="2" stroke-dasharray="5 4"/>

  <g font-family="Menlo, Consolas, monospace" font-size="17" fill="#0f172a" text-anchor="middle">
    <text x="360" y="139">6f</text>
    <text x="420" y="139">6c</text>
    <text x="480" y="139">c3</text>
    <text x="540" y="139">a1</text>
  </g>
  <g font-size="15" fill="#475569" text-anchor="middle">
    <text x="360" y="163">'o'</text>
    <text x="420" y="163">'l'</text>
    <text x="600" y="148">livre</text>
  </g>
  <!-- á ocupa dois bytes -->
  <path d="M454,182 v8 h112 v-8" fill="none" stroke="#0f172a" stroke-width="1.5"/>
  <text x="510" y="210" text-anchor="middle" fill="#0f172a">'á' = 2 bytes</text>
  <!-- len -->
  <path d="M332,224 v8 h236 v-8" fill="none" stroke="#16a34a" stroke-width="1.5"/>
  <text x="450" y="252" text-anchor="middle" fill="#16a34a">len = 4 bytes em uso (3 caracteres)</text>

  <path d="M206,140 C260,140 280,142 326,142" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#seta-verde)"/>

  <text x="24" y="284" font-size="14" fill="#475569">size_of::&lt;String&gt;() == 24 conta só a parte da stack (3 × 8 bytes).</text>
</svg>
