<svg xmlns="http://www.w3.org/2000/svg" width="760" height="350" viewBox="0 0 760 350" font-family="Helvetica, Arial, sans-serif" font-size="15">
  <defs>
    <marker id="seta-verde" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="350" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="24" y="34" font-size="17" font-weight="bold" fill="#0f172a">O que um move faz na memória</text>

  <!-- Painel 1 -->
  <rect x="16" y="50" width="356" height="232" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="32" y="76" font-family="Menlo, Consolas, monospace" font-size="15" fill="#0f172a">1. let s1 = String::from("oi");</text>
  <text x="32" y="108" font-weight="bold" fill="#3b82f6">Stack</text>
  <text x="262" y="108" font-weight="bold" fill="#f97316">Heap</text>
  <rect x="32" y="120" width="170" height="74" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
  <text x="44" y="144" font-weight="bold" fill="#16a34a">s1 (dono)</text>
  <text x="44" y="172" font-size="14" fill="#0f172a">ptr · len 2 · cap 2</text>
  <rect x="262" y="132" width="50" height="50" rx="6" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="287" y="164" font-size="20" fill="#0f172a" text-anchor="middle">o</text>
  <rect x="312" y="132" width="50" height="50" rx="6" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="337" y="164" font-size="20" fill="#0f172a" text-anchor="middle">i</text>
  <path d="M202,157 C228,157 236,157 258,157" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#seta-verde)"/>
  <text x="32" y="232" font-size="14" fill="#475569">s1 é o único dono do buffer.</text>
  <text x="32" y="254" font-size="14" fill="#475569">No fim do escopo, s1 libera o heap.</text>

  <!-- Painel 2 -->
  <rect x="388" y="50" width="356" height="232" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="404" y="76" font-family="Menlo, Consolas, monospace" font-size="15" fill="#0f172a">2. let s2 = s1;</text>
  <text x="404" y="108" font-weight="bold" fill="#3b82f6">Stack</text>
  <text x="634" y="108" font-weight="bold" fill="#f97316">Heap</text>
  <rect x="404" y="120" width="180" height="70" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="416" y="144" font-weight="bold" fill="#6b7280">s1 (movido)</text>
  <text x="416" y="172" font-size="14" fill="#6b7280">não pode mais ser usado</text>
  <rect x="404" y="200" width="180" height="70" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
  <text x="416" y="224" font-weight="bold" fill="#16a34a">s2 (dono)</text>
  <text x="416" y="252" font-size="14" fill="#0f172a">ptr · len 2 · cap 2</text>
  <rect x="634" y="170" width="50" height="50" rx="6" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="659" y="202" font-size="20" fill="#0f172a" text-anchor="middle">o</text>
  <rect x="684" y="170" width="50" height="50" rx="6" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="709" y="202" font-size="20" fill="#0f172a" text-anchor="middle">i</text>
  <path d="M584,155 C610,155 612,182 632,186" fill="none" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 4"/>
  <path d="M584,235 C606,235 612,212 630,206" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#seta-verde)"/>

  <text x="24" y="312" font-size="14" fill="#475569">O move copia só ptr, len e cap (24 bytes) e invalida s1 para o compilador.</text>
  <text x="24" y="332" font-size="14" fill="#475569">O texto no heap não é copiado, e só s2 vai liberá-lo: nada de double free.</text>
</svg>
