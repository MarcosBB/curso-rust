<svg xmlns="http://www.w3.org/2000/svg" width="640" height="270" viewBox="0 0 640 270" font-family="Helvetica, Arial, sans-serif" font-size="15">
  <defs>
    <marker id="seta-verde" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="640" height="270" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="24" y="34" font-size="17" font-weight="bold" fill="#0f172a">let s2 = s1.clone();</text>
  <text x="24" y="72" font-weight="bold" fill="#3b82f6">Stack</text>
  <text x="420" y="72" font-weight="bold" fill="#f97316">Heap</text>

